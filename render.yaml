services:
  - type: web
    name: fluxopay
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PORT
        value: 10000
      - key: RELOAD
        value: false
    # Para persistência do SQLite e uploads, use um disco:
    disk:
      name: fluxopay-data
      mountPath: /app/data
      sizeGB: 1
