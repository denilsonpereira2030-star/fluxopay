{% extends "base.html" %}

{% block body %}
<div class="gerente-shell">
  <!-- TOPBAR -->
  <header class="gerente-topbar">
    <div class="brand-mark">
      <div class="brand-icon" style="width:30px;height:30px;border-radius:10px;">
        <svg viewBox="0 0 24 24" style="width:15px;height:15px;" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </div>
      <div>
        <div style="font-family:var(--ff-head);font-size:14px;font-weight:700;color:var(--txt-1);">FluxoPay</div>
        <div style="font-size:10px;color:var(--txt-3);text-transform:uppercase;letter-spacing:0.06em;">{{ est_nome }}</div>
      </div>
    </div>
    <a href="/logout" class="btn btn-ghost btn-sm">Sair</a>
  </header>

  <main class="gerente-main">
    {% block ger_content %}{% endblock %}
  </main>

  <!-- BOTTOM NAV -->
  <nav class="gerente-bottom-nav">
    <a href="/gerente" class="gnav-link {% if active == 'novo' %}active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      <span>Novo</span>
    </a>
    <a href="/gerente/contas" class="gnav-link {% if active == 'contas' %}active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span>Minhas Contas</span>
    </a>
    <a href="/gerente/boletos" class="gnav-link {% if active == 'boletos' %}active{% endif %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v4H3z"/><path d="M3 10h18v4H3z"/><path d="M3 17h18v4H3z"/></svg>
      <span>Todas as Lojas</span>
    </a>
  </nav>
</div>

<style>
.gerente-topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 8px 12px;
  min-height: 50px;
  max-height: 55px;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  position: sticky; top: 0; z-index: 50;
}

.gerente-main {
  flex: 1;
  padding: 20px 16px 100px;
  max-width: 520px;
  margin: 0 auto;
  width: 100%;
}

.gerente-bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  padding: 8px 12px;
  padding-bottom: max(8px, env(safe-area-inset-bottom, 0px));
  z-index: 50;
}

.gnav-link {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 8px 6px;
  border-radius: var(--r-md);
  color: var(--txt-3);
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  transition: background 0.15s, color 0.15s;
  text-decoration: none;
}
.gnav-link svg { width: 22px; height: 22px; }
.gnav-link.active { color: var(--blue-hi); background: var(--blue-dim); }
.gnav-link:hover { color: var(--txt-1); background: var(--lift); }
</style>
{% endblock %}
