{% extends "base.html" %}

{% block body %}
<div class="shell">
  <!-- SIDEBAR -->
  <nav class="sidebar">
    <div class="sidebar__brand">
      <div class="brand-mark">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </div>
        <div>
          <div class="brand-name">FluxoPay</div>
          <div class="brand-sub">Contas a Pagar</div>
        </div>
      </div>
    </div>

    <div class="sidebar__nav">
      <div class="nav-section-label">Painel</div>
      <a href="/financeiro" class="nav-link {% if active == 'dashboard' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>

      <div class="nav-section-label" style="margin-top:12px;">Boletos</div>
      <a href="/financeiro/boletos" class="nav-link {% if active == 'boletos' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v4H3z"/><path d="M3 10h18v4H3z"/><path d="M3 17h18v4H3z"/></svg>
        Por Estabelecimento
      </a>
      <a href="/financeiro/lote" class="nav-link {% if active == 'lote' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><polyline points="8 21 12 17 16 21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        Lote da Semana
      </a>
      <a href="/financeiro/historico" class="nav-link {% if active == 'historico' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Histórico
      </a>
    </div>

    <div class="sidebar__user">
      <div class="user-row">
        <div class="user-avatar">{{ user.login[0].upper() }}</div>
        <div class="user-info">
          <div class="user-name">{{ user.login }}</div>
          <div class="user-role">Financeiro</div>
        </div>
        <a href="/logout" class="logout-btn" title="Sair">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </a>
      </div>
    </div>
  </nav>

  <!-- MOBILE TOPBAR -->
  <div class="mobile-topbar">
    <div class="brand-mark">
      <div class="brand-icon" style="width:28px;height:28px;">
        <svg viewBox="0 0 24 24" style="width:14px;height:14px;" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </div>
      <span style="font-family:var(--ff-head);font-weight:700;font-size:14px;">FluxoPay</span>
    </div>
    <a href="/logout" class="btn btn-ghost btn-sm">Sair</a>
  </div>

  <!-- MAIN -->
  <main class="main-content">
    {% block fin_content %}{% endblock %}
  </main>

  <!-- MOBILE BOTTOM NAV -->
  <nav class="mobile-nav">
    <div class="mobile-nav-grid" style="grid-template-columns:repeat(5,1fr);">
      <a href="/financeiro" class="mobile-nav-link {% if active == 'dashboard' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="/financeiro/boletos" class="mobile-nav-link {% if active == 'boletos' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v4H3z"/><path d="M3 10h18v4H3z"/><path d="M3 17h18v4H3z"/></svg>
        Boletos
      </a>
      <a href="/financeiro/lote" class="mobile-nav-link {% if active == 'lote' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/></svg>
        Lote
      </a>
      <a href="/financeiro/historico" class="mobile-nav-link {% if active == 'historico' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Histórico
      </a>
      <a href="/logout" class="mobile-nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sair
      </a>
    </div>
  </nav>
</div>
{% endblock %}
